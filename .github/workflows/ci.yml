name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  dotnet:
    name: .NET build and migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: baby_tracker
          POSTGRES_USER: baby_tracker
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baby_tracker -d baby_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ConnectionStrings__BabyTracker: Host=localhost;Port=5432;Database=baby_tracker;Username=baby_tracker;Password=ci-only
      ASPNETCORE_URLS: http://127.0.0.1:5080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BabyTracker.slnx
      - run: dotnet build BabyTracker.slnx --configuration Release --no-restore
      - name: Start API
        run: dotnet run --project apps/api/src/BabyTracker.Api --configuration Release --no-build > /tmp/baby-tracker-api.log 2>&1 &
      - name: Verify migrations and readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/baby-tracker-api.log
          exit 1
